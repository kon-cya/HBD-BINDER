<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HBD BINDER</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/Mona10x12.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Mona10x12";
    src: url("fonts/Mona10x12.woff2") format("woff2");
    font-display: block;
  }

  :root {
    --bg: #0b0a0c;
    --ink: #f2efe6;
    --blue: #079fe6;
    --track: rgba(242, 239, 230, .18);
    --px: 24px;            /* 폰트 1칸 = 12px의 배수일 때 가장 선명함 */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: #000;
    color: var(--ink);
    font-family: "Mona10x12", monospace;
    font-size: var(--px);
    line-height: 1.5;
    -webkit-font-smoothing: none;
    font-smooth: never;
    overflow: hidden;
  }

  /* ---------- 배경: 사진 전체를 보이게 + 가장자리는 검게 ---------- */
  .bg {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    aspect-ratio: 248 / 139;
    width: min(115vw, 205vh);              /* 가로 화면: 사진 거의 전체 */
    background: url("images/bg-small.png") center / 100% 100% no-repeat;
    image-rendering: pixelated;
    filter: brightness(.78);
    -webkit-mask-image: radial-gradient(closest-side, #000 70%, transparent 100%);
            mask-image: radial-gradient(closest-side, #000 70%, transparent 100%);
    pointer-events: none;
  }
  @media (orientation: portrait) {
    .bg { width: 200vw; }                   /* 세로 화면: 가운데 절반 정도 */
  }

  .screen {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 16px;
  }

  /* ---------- 로딩 ---------- */
  .loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    transition: opacity .15s linear;
  }
  .loader.done { opacity: 0; }

  /* 8칸 픽셀 스피너 */
  .spinner {
    position: relative;
    width: 48px;
    height: 48px;
    animation: spin .8s steps(8) infinite;
  }
  .spinner i {
    position: absolute;
    left: 21px;
    top: 0;
    width: 6px;
    height: 12px;
    background: var(--ink);
    transform-origin: 3px 24px;
  }
  .spinner i:nth-child(1) { transform: rotate(0deg);   opacity: 1; }
  .spinner i:nth-child(2) { transform: rotate(45deg);  opacity: .85; }
  .spinner i:nth-child(3) { transform: rotate(90deg);  opacity: .7; }
  .spinner i:nth-child(4) { transform: rotate(135deg); opacity: .55; }
  .spinner i:nth-child(5) { transform: rotate(180deg); opacity: .4; }
  .spinner i:nth-child(6) { transform: rotate(225deg); opacity: .3; }
  .spinner i:nth-child(7) { transform: rotate(270deg); opacity: .2; }
  .spinner i:nth-child(8) { transform: rotate(315deg); opacity: .12; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .bar {
    display: grid;
    grid-template-columns: repeat(20, 10px);
    gap: 2px;
  }
  .bar span {
    height: 12px;
    background: var(--track);
  }
  .bar span.on { background: var(--blue); }

  .label {
    display: flex;
    gap: 12px;
    letter-spacing: 0;
  }
  .pct { min-width: 4ch; text-align: right; }

  /* ---------- 말풍선 ---------- */
  .bubble {
    position: relative;
    max-width: 100%;
    padding: 12px 30px 14px;
    background: var(--blue);
    color: #fff;
    text-align: right;
    border-radius: 34px / 22px;
    opacity: 0;
    transform: translateY(28px);
    pointer-events: none;
  }
  .bubble p { white-space: nowrap; }

  /* 오른쪽 아래 꼬리 */
  .bubble::after {
    content: "";
    position: absolute;
    right: 14px;
    bottom: -24px;
    width: 40px;
    height: 30px;
    background: var(--blue);
    clip-path: polygon(0 0, 100% 0, 100% 100%);
  }

  .bubble.show {
    opacity: 1;
    transform: translateY(0);
    transition: transform .22s cubic-bezier(.2, .9, .3, 1), opacity .12s linear;
  }

  @media (max-width: 420px) {
    :root { --px: 18px; }
    .bubble { padding: 10px 22px 12px; border-radius: 28px / 18px; }
    .bubble::after { right: 10px; bottom: -18px; width: 30px; height: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2s; }
    .bubble, .bubble.show { transform: none; transition: opacity .2s; }
  }
</style>
</head>
<body>

  <div class="bg" aria-hidden="true"></div>

  <div class="screen" aria-live="polite">
    <div class="loader" id="loader" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="로딩 중">
      <div class="spinner" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="bar" id="bar" aria-hidden="true"></div>
      <div class="label"><span>LOADING</span><span class="pct" id="pct">0%</span></div>
    </div>
  </div>

  <div class="screen">
    <div class="bubble" id="bubble" aria-hidden="true">
      <p>걱정 마, 린쉬한</p>
      <p>나 안 죽어. 죽지 말라고 했으니까!</p>
    </div>
  </div>

<script>
  (function () {
    var loader = document.getElementById("loader");
    var bar = document.getElementById("bar");
    var pct = document.getElementById("pct");
    var bubble = document.getElementById("bubble");
    var CELLS = 20;

    for (var i = 0; i < CELLS; i++) bar.appendChild(document.createElement("span"));
    var cells = bar.children;

    function render(v) {
      pct.textContent = v + "%";
      loader.setAttribute("aria-valuenow", v);
      var lit = Math.round(v / 100 * CELLS);
      for (var i = 0; i < CELLS; i++) cells[i].classList.toggle("on", i < lit);
    }

    function finish() {
      loader.classList.add("done");
      setTimeout(function () {
        loader.parentNode.style.display = "none";
        bubble.removeAttribute("aria-hidden");
        bubble.classList.add("show");
      }, 200);
    }

    function start() {
      var v = 0;
      (function tick() {
        // 불규칙하게 차오르다가 끝에서 잠깐 멈칫
        v = Math.min(100, v + 1 + Math.floor(Math.random() * 7));
        render(v);
        if (v >= 100) { setTimeout(finish, 200); return; }
        var wait = v > 85 ? 140 : 40 + Math.random() * 90;
        setTimeout(tick, wait);
      })();
    }

    // 폰트가 준비된 뒤 시작 (최대 1.5초 대기)
    var started = false;
    function go() { if (!started) { started = true; start(); } }
    if (document.fonts && document.fonts.load) {
      document.fonts.load('24px "Mona10x12"').then(go, go);
      setTimeout(go, 1500);
    } else {
      go();
    }
  })();
</script>
</body>
</html>
